support: >-
  An early personal project with no support and no warranty. Respectful ideas and comments are
  welcome through the feedback form.
internal:
  sources:
    - aios repository README, CHANGELOG, docs/HANDOFF.md and docs/product-goal.md at commit 713dfd5
    - GitHub releases API for the aios repository (debug-signed APKs only, v0.3.0 to v0.5.0)
    - docs/assets screenshots, generated by apps/web/e2e/readme-shots.mjs from sample data
  verified: '2026-10-28'
  notes: >-
    The aios repo is public source with MIT license, but it is the source repo, so the site never
    links it. Its releases are debug-signed APKs attached to the source repo, so no download is
    offered (brief forbids publishing debug builds or linking source). Ask Travis about a separate
    public release repo and a release-signed APK.
