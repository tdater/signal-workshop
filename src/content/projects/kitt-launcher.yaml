setupTrail:
  - {
      id: pick-edition,
      title: Pick your edition,
      detail: 'Portrait screen of 11 inches or more: KITT Launcher. A 7 to 10 inch landscape screen: KITT Launcher.2. They have different app IDs, so you can install both.',
    }
  - {
      id: download,
      title: Download the APK on the head unit,
      detail: 'Use the download button on this page, or copy the file over on a USB stick. Compare the SHA-256 if you moved it between devices.',
      guide: install-kitt-launcher,
    }
  - {
      id: install,
      title: Allow the install and open it,
      detail: 'Android asks you to allow your browser or file manager to install unknown apps. Allow it for that one app only.',
      guide: install-kitt-launcher,
    }
  - {
      id: set-home,
      title: Make it the home screen,
      detail: 'Press Home, choose KITT Launcher (or KITT Launcher.2), then Always.',
      guide: install-kitt-launcher,
    }
  - {
      id: system-check,
      title: Run System check,
      detail: 'At the top of KITT Config. It lists every permission and setting KITT needs, each with a fix button.',
    }
  - {
      id: adapter,
      title: Connect your OBD-II adapter (parked),
      detail: 'Diagnostics → Link. Engine running or ignition on, car parked.',
      guide: connect-obd-adapter,
    }
  - {
      id: ai,
      title: Add an AI key (optional),
      detail: "KITT Config → AI core & personality. Pick Classic if you don't want the swearing.",
      guide: set-up-kitt-ai,
    }
  - {
      id: final-test,
      title: Final test,
      detail: 'Gauges show live values, and asking KITT "how''s my coolant?" gets an answer that quotes a reading. This checklist can''t see your car, so only you can tick this one.',
    }
support: >-
  No formal support, and the app README says bug reports aren't taken. You can still leave a
  respectful comment or suggestion through the feedback form, and it may help shape a future
  release.
internal:
  sources:
    - KITT-Launcher-releases README and features page (index.html), commit 0ac768d
    - KITT-Launcher.2 README, FEATURES.md, AndroidManifest.xml
    - GitHub releases API for both release repositories
  verified: '2026-10-23'
  notes: Source repos are public on GitHub but the READMEs say source is not published, so the site never links them.
