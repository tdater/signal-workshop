- id: blackbox-internet
  question: Does BLACKBOX send my data anywhere?
  answer: >-
    The standard edition doesn't request internet permission at all, and each release is checked
    for that automatically. The optional AI runs on the phone from a model file you import. Only
    the separate BLACKBOX Net app has internet permission, for its ping, port and DNS tools.
  projects: [blackbox]
  topics: [Privacy]
  reviewed: '2026-10-23'
  published: true
- id: blackbox-status
  question: Is BLACKBOX finished?
  answer: >-
    No. It's in active development at 0.2.1. Core workflows have automated tests, including
    emulator runs at phone and unfolded-Fold sizes. Real-device behaviour, tabletop posture, the
    widget, photo text reading, dictation and on-device AI with a real model still need
    verification.
  projects: [blackbox]
  topics: [Status]
  reviewed: '2026-10-23'
  published: true
- id: checksum-meaning
  question: What does the SHA-256 checksum on a download prove?
  answer: >-
    That your file is byte-for-byte the published file. It doesn't prove the app is safe, bug-free
    or compatible with your device, and it doesn't replace Android's app signing.
  topics: [Security, Installation]
  links: [{ label: Verify a download, href: /guides/verify-a-download }]
  reviewed: '2026-10-23'
  published: true
- id: developer-verification
  question: Will Android's new developer verification block these apps?
  answer: >-
    It depends on your device and region. From 30 September 2026, certified Android devices in
    Brazil, Indonesia, Singapore and Thailand require registered developers, and Google plans to
    expand globally from 2027. Google says unregistered apps can still be installed with adb or an
    advanced flow. Whether these apps are registered hasn't been confirmed yet.
  topics: [Installation, Compatibility]
  links: [{ label: Installing apps from this site, href: /guides/installing-android-apps }]
  reviewed: '2026-10-23'
  published: true
- id: support
  question: Do you offer support or take bug reports?
  answer: >-
    These are personal projects shared as-is, with no warranty or support contract. You can still
    send respectful bug reports, questions and ideas through the feedback form. They're read, but
    there's no promise of a reply or a fix.
  topics: [Feedback]
