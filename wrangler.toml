# Cloudflare Pages project config. Secrets (ADMIN_PASSWORD_HASH, SESSION_SECRET, IP_HASH_SALT)
# are set with `wrangler pages secret put` or in the dashboard, never here.
name = "signal-workshop"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "signal-workshop"
# Production D1 database (created 2026-10-24). Not a secret. Local development and tests use a
# local copy under .wrangler/, never this database.
database_id = "43b21d89-ac26-43b3-86ef-db4818ed8539"
migrations_dir = "migrations"
